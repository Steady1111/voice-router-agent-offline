<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>voice-router-lite</title>
  <link rel="stylesheet" href="/style.css?v=20" />
</head>
<body>
  <header>
    <h1>voice-router-lite</h1>
    <div class="header-status">
      <div class="status-item" id="router-header-status">
        <span class="status-dot" id="router-dot"></span>
        <span id="router-header-text">路由器</span>
      </div>
      <div class="status-item" id="fan-header-status">
        <span class="status-dot" id="fan-dot"></span>
        <span id="fan-header-text">风扇</span>
      </div>
      <div class="status-item" id="wake-status">
        <span class="status-dot" id="wake-dot"></span>
        <span id="wake-text">等待唤醒</span>
      </div>
    </div>
  </header>

  <main>
    <div class="main-col">
      <div class="pipeline-demo" id="pipeline-demo">
        <div class="pipeline-step" id="pipe-wake"><strong>① 唤醒</strong><span>—</span></div>
        <div class="pipeline-step" id="pipe-asr"><strong>② 识别</strong><span>—</span></div>
        <div class="pipeline-step" id="pipe-nlu"><strong>③ 意图</strong><span>—</span></div>
      </div>

      <section class="side-panel side-panel-compact main-device-panel">
        <h2>设备状态</h2>
        <ul id="device-list" class="device-list"></ul>
      </section>

      <div class="wake-card debug-only" id="wake-card">
        <div class="wake-card-icon">🎤</div>
        <div class="wake-card-text">
          <div class="wake-card-label" id="wake-label">离线语音控制台</div>
          <div class="wake-card-time" id="wake-time"></div>
        </div>
      </div>

      <div class="chat-panel" id="chat-panel">
        <div class="chat-empty" id="chat-empty">输入或发送指令后，对话内容将显示在这里</div>
        <div class="chat-list" id="chat-list"></div>
      </div>

      <button class="talk-btn" id="talk-btn">
        <span class="talk-btn-icon">🎙️</span>
        <span class="talk-btn-text">按住说话</span>
      </button>

      <form id="text-form" class="debug-form">
        <input id="text-input" placeholder="输入文字指令，如：打开风扇" autocomplete="off" />
        <button type="submit">发送</button>
      </form>

      <div class="suggest-cmds" id="suggest-cmds">
        <span class="suggest-label">推荐指令</span>
        <div class="suggest-chips">
          <button type="button" class="suggest-chip" data-cmd="重启路由器">重启路由器</button>
          <button type="button" class="suggest-chip" data-cmd="WiFi密码多少">WiFi密码多少</button>
          <button type="button" class="suggest-chip" data-cmd="打开访客网络">打开访客网络</button>
          <button type="button" class="suggest-chip" data-cmd="打开风扇">打开风扇</button>
          <button type="button" class="suggest-chip" data-cmd="关闭风扇">关闭风扇</button>
        </div>
      </div>

      <div class="router-cmds" id="router-cmds">
        <label class="suggest-label" for="router-cmd-select">路由器指令</label>
        <select id="router-cmd-select" class="router-cmd-select" aria-label="路由器指令列表">
          <option value="">选择指令发送…</option>
        </select>
      </div>

      <audio id="tts-player" hidden preload="auto"></audio>
    </div>

    <div class="side-col">
      <section class="side-panel status-card" id="router-card">
        <h2>路由器</h2>
        <ul class="status-lines" id="router-lines">
          <li><span>WAN</span><span id="router-wan">—</span></li>
          <li><span>下联设备</span><span id="router-clients">—</span></li>
          <li><span>语音服务</span><span id="router-daemon">—</span></li>
          <li><span>全机内存（路由器）</span><span id="router-ram">—</span></li>
          <li><span>CPU 估算</span><span id="router-cpu">—</span></li>
          <li><span>最后指令</span><span id="router-last-cmd">—</span></li>
        </ul>
      </section>

      <section class="side-panel side-panel-compact" id="monitor-panel">
        <h2>性能监控</h2>
        <div class="monitor-host" id="monitor-host">加载中…</div>
        <div class="monitor-grid" id="monitor-grid"></div>
      </section>
    </div>
  </main>

  <script src="/app.js?v=33"></script>
</body>
</html>
